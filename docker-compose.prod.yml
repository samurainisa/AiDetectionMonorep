services:
  db:
    image: postgres:16-alpine
    container_name: aidetection-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_detection
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ai_detection"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./AiDetectionBackend
      dockerfile: Dockerfile
      args:
        INSTALL_TRAINING_DEPS: ${INSTALL_TRAINING_DEPS:-false}
    container_name: aidetection-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/ai_detection
      PANGRAM_API_KEY: ${PANGRAM_API_KEY:-}
      AI_MODE: ${AI_MODE:-pangram_only}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:--1}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ai-detection.ru,https://www.ai-detection.ru}
      FLASK_ENV: production
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./AiDetectionFrontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_API_KEY: ${VITE_API_KEY:-}
    container_name: aidetection-frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: aidetection-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  backend_uploads:
  caddy_data:
  caddy_config:
