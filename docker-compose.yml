services:
  db:
    image: postgres:16-alpine
    container_name: aidetection-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_detection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_detection"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./AiDetectionBackend
      dockerfile: Dockerfile
      args:
        INSTALL_TRAINING_DEPS: ${INSTALL_TRAINING_DEPS:-false}
    container_name: aidetection-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod-please-set-32-plus-chars}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_detection
      PANGRAM_API_KEY: ${PANGRAM_API_KEY:-}
      AI_MODE: ${AI_MODE:-pangram_only}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:--1}
      FLASK_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - ./AiDetectionBackend/uploads:/app/uploads

  # frontend:
