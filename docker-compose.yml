services:
  db:
    image: postgres:16-alpine
    container_name: aidetection-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_detection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_detection"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./AiDetectionBackend
      dockerfile: Dockerfile
      args:
        INSTALL_TRAINING_DEPS: ${INSTALL_TRAINING_DEPS:-false}
    container_name: aidetection-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod-please-set-32-plus-chars}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_detection
      PANGRAM_API_KEY: ${PANGRAM_API_KEY:-}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8001}
      AI_MODE: ${AI_MODE:-pangram_only}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:--1}
      FLASK_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - ./AiDetectionBackend/uploads:/app/uploads

  ml-service:
    build:
      context: ./AiDetectionML
      dockerfile: ml_service/Dockerfile
    container_name: aidetection-ml
    restart: unless-stopped
    environment:
      MODEL_DIR: /app/models/rubert_tiny2_ai_detector
      MAX_TEXT_LENGTH: ${ML_MAX_TEXT_LENGTH:-200000}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10

  frontend:
    build:
      context: ./AiDetectionFrontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
        VITE_API_KEY: local-docker-key
    container_name: aidetection-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
